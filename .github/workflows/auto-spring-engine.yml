name: Autonomous Garage Door Torsion Spring & IPPT Engine

on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:
    inputs:
      custom_spring:
        description: 'Optional Torsion Spring Size or Door Spec (e.g. 0.225 x 2 x 26 or 16x7 Insulated Door)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  generate-spring-calculators:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Torsion Spring Calculators & Ping Search Engines
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          PAGES_PER_RUN: '3'
          CUSTOM_SPRING: ${{ github.event.inputs.custom_spring || '' }}
        run: |
          python engine/spring_builder.py

      - name: Self-Healing Commit & Push to Trigger GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/published_springs.json
          if git diff --staged --quiet; then
            echo "No new torsion spring calculator pages to commit."
          else
            git commit -m "chore(springs): auto-publish new garage door torsion spring IPPT calculators"
            for i in 1 2 3; do
              git pull --rebase origin main || true
              if git push origin main; then
                echo "Pushed successfully on attempt $i"
                break
              fi
              sleep 5
            done
          fi
